version: "3.9"

services:
  trading_bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading_service
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://127.0.0.1:8000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
