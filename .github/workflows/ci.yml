name: CI

on:
  push:
    branches:
      - main
      - ver2.0
  pull_request:
    branches:
      - main

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13.x'

      - name: Install dependencies
        run: |
          python -m pip install poetry
          poetry install

      - name: Run ruff
        run: |
          poetry run ruff check

      - name: Run pytest
        run: |
          pytest -v -rA --showlocals --disable-warnings --maxfail=1
